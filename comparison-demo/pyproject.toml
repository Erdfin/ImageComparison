[project]
name = "comparison-demo"
version = "0.1.0"
description = "Compare images with classical (non-ML) similarity/difference metrics"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.4",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "imagehash>=4.3",
    "streamlit>=1.50",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["metrics", "sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
